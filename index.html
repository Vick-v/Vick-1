<script>
// Highly permissive, universally routed global App ID
const APP_ID = 16929;
let socket;
let tickHistory = [];
let isAuthenticated = false;
let isTrading = false;

function initWS() {
  log("Initializing background market pipeline...", "");
  
  // Dynamic secure websocket pipeline mapping
  socket = new WebSocket(`wss://://derivws.com{APP_ID}`);
  
  socket.onopen = () => {
    document.getElementById('statusPulse').className = 'pulse connected';
    document.getElementById('statusText').innerText = 'SOCKET LIVE';
    log("Network channel successfully opened! Ready for token authentication.", "log-success");
    
    // Automatically subscribe to market ticks immediately on wake
    sendWS({ ticks: document.getElementById('assetSelect').value, subscribe: 1 });
  };
  
  socket.onmessage = (e) => {
    const data = JSON.parse(e.data);
    
    if (data.error) {
      log(`Server Error Alert: ${data.error.message}`, "log-fail");
      return;
    }
    
    if (data.msg_type === 'tick' && data.tick) handleTick(data.tick);
    if (data.msg_type === 'authorize') handleAuth(data);
    if (data.msg_type === 'buy') handleBuyReceipt(data);
    if (data.msg_type === 'proposal_open_contract' && data.proposal_open_contract) handleContractStatus(data.proposal_open_contract);
  };
  
  socket.onclose = (event) => {
    document.getElementById('statusPulse').className = 'pulse';
    document.getElementById('statusText').innerText = 'DISCONNECTED';
    log(`Network stream closed (Code: ${event.code}). Retrying in 5s...`, "log-fail");
    isAuthenticated = false;
    setTimeout(initWS, 5000);
  };

  socket.onerror = (err) => {
    log("Network handshake blocked. Ensure ad-blockers or shields are disabled.", "log-fail");
  };
}

function sendWS(obj) { 
  if(socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify(obj)); 
  } else {
    log("Cannot send message. Market pipeline is currently offline.", "log-fail");
  }
}

// Constant heartbeat connection ping loops
setInterval(() => sendWS({ ping: 1 }), 30000);

function handleTick(tick) {
  const decimals = tick.pip_size ? Math.log10(1 / tick.pip_size) : 2;
  const digit = parseInt(Number(tick.quote).toFixed(decimals).slice(-1));
  if (isNaN(digit)) return;

  const sample = parseInt(document.getElementById('sampleSize').value) || 100;
  tickHistory.push(digit);
  if (tickHistory.length > sample) tickHistory.shift();

  document.getElementById('tickCounter').innerText = `Ticks: ${tickHistory.length}/${sample}`;
  if (tickHistory.length >= 20) processMetrics(sample);
}

function processMetrics(sample) {
  let counts = Array(10).fill(0);
  tickHistory.forEach(d => counts[d]++);
  let pcts = counts.map(c => (c / tickHistory.length) * 100);

  let max = Math.max(...pcts), min = Math.min(...pcts);
  for(let i=0; i<10; i++) {
    let el = document.getElementById(`val-${i}`), box = document.getElementById(`box-${i}`);
    el.innerText = pcts[i].toFixed(1) + '%';
    box.className = 'digit-input-box' + (pcts[i]===max && max!==min ? ' hot' : pcts[i]===min && max!==min ? ' cold' : '');
  }

  let u5 = pcts.slice(0,5).reduce((a,b)=>a+b,0), o4 = pcts.slice(5,10).reduce((a,b)=>a+b,0);
  document.getElementById('under5Pct').innerText = u5.toFixed(1) + '%';
  document.getElementById('over4Pct').innerText = o4.toFixed(1) + '%';

  let card = document.getElementById('signalCard'), txt = document.getElementById('signalText');
  card.classList.remove('over', 'under');

  if (!isTrading && isAuthenticated) {
    document.getElementById('btnOver').disabled = false;
    document.getElementById('btnUnder').disabled = false;
  }

  if (u5 >= 58) { card.classList.add('under'); txt.innerText = "RECOMMENDED: UNDER 5"; }
  else if (o4 >= 58) { card.classList.add('over'); txt.innerText = "RECOMMENDED: OVER 4"; }
  else { txt.innerText = "MARKET MATRIX NEUTRAL"; }
}

function authenticateToken() {
  const token = document.getElementById('apiToken').value.trim();
  if(!token) return log("Please input a valid API token string first.", "log-fail");
  log("Transmitting secured handshake wrapper payload...", "");
  sendWS({ authorize: token });
}

function handleAuth(data) {
  isAuthenticated = true;
  log(`Success! Authenticated profile wallet safely.`, "log-success");
  document.getElementById('accountInfo').style.display = 'block';
  document.getElementById('accId').innerText = data.authorize.loginid;
  document.getElementById('accBalance').innerText = `${data.authorize.currency} ${Number(data.authorize.balance).toFixed(2)}`;
  document.getElementById('authBtn').innerText = "CONNECTED";
  document.getElementById('authBtn').disabled = true;
}

function executeTrade(type, barrier) {
  if(!isAuthenticated || isTrading) return;
  isTrading = true;
  setButtonsState(true);

  const stake = parseFloat(document.getElementById('tradeStake').value) || 1.0;
  const symbol = document.getElementById('assetSelect').value;

  log(`Deploying trade parameter block: Buy ${type}...`, "");

  sendWS({
    buy: 1,
    price: stake * 1.5,
    parameters: {
      amount: stake,
      basis: "stake",
      barrier: barrier.toString(),
      duration: 1,
      duration_unit: "t",
      contract_type: type,
      currency: "USD",
      symbol: symbol
    },
    subscribe: 1
  });
}

function handleBuyReceipt(data) {
  log(`Contract filled safely. ID: ${data.buy.contract_id}. Tracking settlement...`, "log-success");
}

function handleContractStatus(contract) {
  if (contract.is_expired) {
    const profit = Number(contract.profit).toFixed(2);
    if (contract.status === 'won') {
      log(`[WIN] Settled in money! Profit: +$${profit}`, "log-success");
    } else {
      log(`[LOSS] Expired out of money. Settlement: $${profit}`, "log-fail");
    }
    if(contract.current_spot_balance) {
      document.getElementById('accBalance').innerText = `USD ${Number(contract.current_spot_balance).toFixed(2)}`;
    }
    isTrading = false;
    setButtonsState(false);
  }
}

function setButtonsState(state) {
  document.getElementById('btnOver').disabled = state;
  document.getElementById('btnUnder').disabled = state;
}

function changeAsset() { 
  tickHistory = []; 
  sendWS({ ticks: document.getElementById('assetSelect').value, subscribe: 1 }); 
}

function log(msg, cls) {
  const box = document.getElementById('logBox');
  box.innerHTML = `<div class="log-entry ${cls}">> [${new Date().toLocaleTimeString()}] ${msg}</div>` + box.innerHTML;
}

window.addEventListener('load', initWS);
</script>
